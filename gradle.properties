# Public signature dependencies only; keep private/platform dependencies in their source sets.
project.dependencies.commonMainApiBundle=
# Acceptance contract: comma-separated JVM internal .class paths, not source filenames.
project.publication.android.publicClasses=
# Explicit group:root-module:Android-POM-module entries; no automatic -android assumptions.
project.publication.android.apiDependencies=
